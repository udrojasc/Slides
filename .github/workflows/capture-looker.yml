name: Refresh Looker Studio captures

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/capture-looker.yml'
      - 'scripts/capture-reports.mjs'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: looker-captures
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture public Looker Studio and Power BI reports
        run: node scripts/capture-reports.mjs

      - name: Publish updated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captures/report-1.png captures/report-2.png captures/report-3.png
          if git diff --cached --quiet; then
            echo "Captures are unchanged; no commit needed."
          else
            git commit -m "Refresh dashboard captures"
            # Keep the capture commit on top of any code changes pushed while
            # Playwright was rendering the reports.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
